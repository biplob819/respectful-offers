name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history audit scans every commit
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q -n auto --dist loadfile -m "not perf"
      # timing budgets are measured alone, never beside other tests (L-41)
      - run: uv run pytest -q -m perf
        if: runner.os == 'Linux'  # the budget is the deployed demo's, on Linux (D-55)
      - run: uv run python scripts/secret_scan.py
      - run: uv run python scripts/data_scan.py
      - run: uv run python scripts/verify_graph_eligibility.py
      - run: uv run offers metrics --check
      - run: uv run evalkit gate results/kkbox/metrics.json --config configs/gates.yaml --out ${{ runner.temp }}/gate.json
      - run: uv build
