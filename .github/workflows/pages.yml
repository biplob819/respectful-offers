name: pages

# Publishes the results report (and any pages under docs/site/) to GitHub Pages (OWNER D-15).
# The site is assembled by scripts/build_site.py, which refuses anything the publish scan rejects.

on:
  push:
    branches: [main]
    paths:
      - "results/kkbox/report/**"
      - "docs/site/**"
      - "scripts/build_site.py"
      - "scripts/data_scan.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
