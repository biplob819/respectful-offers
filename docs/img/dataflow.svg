<text x="500" y="56" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">Real KKBox members, simulated offer responses (frozen before the real run)</text>
<rect x="40" y="84" width="190" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="135" y="109" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">KKBox raw files</text>
<text x="135" y="125" font-size="11" font-weight="400" fill="#5f6368" text-anchor="middle">members, transactions, logs</text>
<rect x="280" y="84" width="190" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
