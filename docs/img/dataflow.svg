<text x="375" y="125" font-size="11" font-weight="400" fill="#5f6368" text-anchor="middle">verified by sha256 manifest</text>
<rect x="520" y="84" width="190" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="615" y="109" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Features as of a date</text>
<text x="615" y="125" font-size="11" font-weight="400" fill="#5f6368" text-anchor="middle">no future data (leak tests)</text>
<rect x="760" y="84" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
<text x="860" y="109" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Churn model</text>
<text x="860" y="125" font-size="11" font-weight="400" fill="#5f6368" text-anchor="middle">gradient boosting + isotonic</text>
