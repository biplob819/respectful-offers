<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Respectful Offers data flow</title><desc id="d">From the raw KKBox files to features, a calibrated churn model, a cohort split, a respect filter in front of every policy, simulated rollouts under common random numbers, an independent audit and off-policy checks, aggregated into the report, PR/FAQ, demo cube and EvalKit release gates. Every outcome is simulated.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#80868b"/></marker></defs>
<rect width="1000" height="860" fill="#ffffff"/>
