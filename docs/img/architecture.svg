<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Respectful Offers architecture</title><desc id="d">Interfaces (CLI, report, demo, EvalKit gates) sit on the respectful_offers library: features, churn, simulator, policies with the respect filter, auditor, off-policy estimators, evaluation and report, over a cached stage runner and artifact store. A gated build harness and CI build and release it.</desc>
