<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 360" role="img" class="chart"><style>:root{--fg:#1d1d1f;--muted:#5f6368;--line:#d9dce1;--c-grey:#6b7280;--c-orange:#d55e00;--c-blue:#0072b2;--c-green:#009e73;--c-purple:#7a4fa3}@media (prefers-color-scheme:dark){:root{--fg:#e8eaed;--muted:#a8adb4;--line:#3a3d42;--c-orange:#f08a4b;--c-blue:#56b4e9;--c-green:#3fcf9f}}.chart text{fill:var(--fg);font:12px system-ui,sans-serif}.chart .tick{fill:var(--muted)}.chart .grid{stroke:var(--line);stroke-width:1}.chart .label{font-weight:600}</style><title>Discount cost per extra member kept, by simulator variant (simulated)</title><desc>Real KKBox members, simulated offer responses. For each of three pre-registered simulator variants, the discount each policy spends per extra member kept against no offer, with 95% bootstrap intervals.</desc><line x1="302.0" x2="302.0" y1="24" y2="308" class="grid"/><text x="302.0" y="326" text-anchor="middle" class="tick">0</text><line x1="407.0" x2="407.0" y1="24" y2="308" class="grid"/><text x="407.0" y="326" text-anchor="middle" class="tick">100</text><line x1="512.0" x2="512.0" y1="24" y2="308" class="grid"/><text x="512.0" y="326" text-anchor="middle" class="tick">200</text><line x1="617.0" x2="617.0" y1="24" y2="308" class="grid"/><text x="617.0" y="326" text-anchor="middle" class="tick">300</text><line x1="722.0" x2="722.0" y1="24" y2="308" class="grid"/><text x="722.0" y="326" text-anchor="middle" class="tick">400</text><text x="292" y="41" text-anchor="end" class="series">conservative: Bandit</text><line x1="496.9" x2="541.4" y1="37" y2="37" stroke="var(--c-green)" stroke-width="2"/><polygon points="517.3,30.5 522.3,37.0 517.3,43.5 512.3,37.0" fill="var(--c-green)" stroke="var(--bg)" stroke-width="1"/><text x="292" y="67" text-anchor="end" class="series">conservative: Rule-following baseline</text><line x1="616.2" x2="658.6" y1="63" y2="63" stroke="var(--c-blue)" stroke-width="2"/><polygon points="636.4,57.0 630.9,67.0 641.9,67.0"