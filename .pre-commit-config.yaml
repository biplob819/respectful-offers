repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan
        entry: python scripts/secret_scan.py
        language: system
        pass_filenames: false
      - id: data-scan
        name: raw and member-level data scan
        entry: python scripts/data_scan.py
        language: system
        pass_filenames: false
